[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-tag"
version = "0.0.1"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crazyflow==0.4.0",
  "jax==0.12.0.1",
  "jaxlib==0.12.0.1",
  "mujoco==4.0.0",
  "mujoco-mjx==4.0.0",
  "numpy==2.5.4",
  "flax==0.12.12",
  "optax==0.2.8",
  "pyyaml==6.0.3",
  "wandb==0.31.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1", "types-PyYAML"]
gpu = ["jax[cuda12]==0.12.0.1"]

[tool.setuptools.packages.find]
include = ["sim*", "train*", "eval*", "sysid*"]
