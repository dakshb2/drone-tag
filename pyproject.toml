[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-tag"
version = "0.0.1"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crazyflow==0.4.0",
  "jax==0.12.0.1",
  "jaxlib==0.12.0.1",
  "mujoco==4.0.0",
  "mujoco-mjx==4.0.0",
  "numpy==2.5.4",
  "flax==0.12.12",
  "optax==0.2.8",
  "pyyaml==6.0.3",
  "wandb==0.31.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1", "types-PyYAML"]
gpu = ["jax[cuda12]==0.12.0.1"]

[tool.setuptools.packages.find]
include = ["sim*", "train*", "eval*", "sysid*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
files = ["sim", "train", "eval", "sysid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds a Crazyflow sim (several seconds)"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff.lint.isort]
known-first-party = ["sim", "train", "eval", "sysid"]
known-third-party = ["wandb"]
