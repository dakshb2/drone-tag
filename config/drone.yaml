# Owner: WS5. Schema: docs/contracts.md section 10. PLACEHOLDER until system ID.
contract_version: "0.2"
crazyflow_drone_model: cf21B_500
limits:
  v_xy: 1.0       # m/s
  v_z: 0.5        # m/s
  yaw_rate: 1.57  # rad/s
mass: null        # kg, set after WS4 payload freeze
onboard_controller:           # firmware PID controller, Crazyflie 2.1 Brushless defaults (firmware master 2026-11-11)
  position_rate: 100          # Hz, velocity loop
  attitude_rate: 500          # Hz, yaw setpoint integration
  vel_xy:                     # body-yaw velocity error (m/s) -> pitch/roll setpoint (rad)
    kp: 0.436332              # rad/(m/s), firmware 25 deg/(m/s)
    ki: 0.0174533             # rad/m, firmware 1 deg/m
    kd: 0.0
    i_limit: 5000.0           # m, firmware default (effectively unlimited)
    output_limit: 0.383972    # rad, 20 deg x 1.1 overhead
  vel_z:                      # vz error (m/s) -> thrust offset (PWM)
    kp: 25000.0               # PWM/(m/s), firmware 25 x thrustScale 1000
    ki: 15000.0               # PWM/m, firmware 15 x 1000
    kd: 0.0
    i_limit: 5000.0           # m
    output_limit: 32767.0     # PWM, firmware UINT16_MAX / 2
  roll_pitch_limit: 0.349066  # rad, 20 deg
  thrust_base_pwm: 30000.0    # hover feedforward (standard CF2.1 is 36000)
  thrust_min_pwm: 20000.0
  thrust_max_pwm: 65535.0
  yaw_max_delta: 0.0          # rad, 0 = no clamp
